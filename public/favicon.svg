  <!-- Subtle terracotta border accent -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#d97746" stroke-width="2" stroke-opacity="0.8"/>
  <!-- Monogram TK Typography -->
  <text x="32" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', Roboto, sans-serif" font-size="27" font-weight="800" letter-spacing="-1px" fill="#f0f3f5" text-anchor="middle">
    T<tspan fill="#d97746">K</tspan>
  </text>
</svg>
